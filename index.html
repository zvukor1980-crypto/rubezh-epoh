		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1f3359;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
  // v1.3.3 — звук на iPhone (Safari и приложение «На экран Домой»).
  // 1) iOS глушит Web Audio переключателем «Бесшумно»: просим категорию «воспроизведение» (navigator.audioSession, iOS 17+),
  //    а на старых iOS — запускаем тихий зацикленный <audio> на первом касании (звук идёт как медиа, а не как «звонок»).
  // 2) AudioContext Godot создаётся до касания и остаётся suspended — возобновляем его на каждом жесте (touchend/pointerup/click),

    }

    function setSession() { try { if (hasSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch (e) {} }
    setSession();
    var silent = null;
    function silentWavUrl() {   // 0.5 с тишины, 8 кГц, 8 бит, моно — собираем WAV прямо в памяти
      var n = 4000, b = new ArrayBuffer(44 + n), v = new DataView(b), w = function (o, t) { for (var i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
      w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
      for (var i = 0; i < n; i++) v.setUint8(44 + i, 128);
      return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
    }
    function playSilent() {     // только если нет audioSession (iOS < 17)
      if (hasSession || document.hidden) return;
      try {
        if (!silent) { silent = document.createElement('audio'); silent.setAttribute('x-webkit-airplay', 'deny'); silent.preload = 'auto';
          silent.loop = true; silent.src = silentWavUrl(); silent.setAttribute('playsinline', ''); }

      } catch (e) {}
    }
    function kick(c) {          // пустой буфер внутри жеста «будит» вывод в WebKit
      try { var b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) {}
    }
    function resumeAll(gesture) {
      if (document.hidden) return;
      setSession();
      if (gesture) playSilent();
      ctxs.forEach(function (c) {
        if (c.state === 'closed') return;
        if (c.state !== 'running') { try { var p = c.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (gesture) kick(c);
      });
    }
    function hook(c) {          // iOS: "interrupted"/"suspended" после звонка или блокировки — пробуем вернуть сразу
      try { c.addEventListener('statechange', function () { if (c.state !== 'running' && c.state !== 'closed' && !document.hidden) setTimeout(function () { resumeAll(false); }, 250); }); } catch (e) {}
    }
    function onGesture() { resumeAll(true); }
    ['touchstart', 'touchend', 'pointerup', 'mousedown', 'click', 'keydown'].forEach(function (ev) {
      document.addEventListener(ev, onGesture, { capture: true, passive: true });
      window.addEventListener(ev, onGesture, { capture: true, passive: true });
    });
    function onHidden() {       // в фоне — тишина (и не держим аудиосессию)
      ctxs.forEach(function (c) { try { if (c.state === 'running') c.suspend(); } catch (e) {} });
      if (silent && !silent.paused) try { silent.pause(); } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () { if (document.hidden) onHidden(); else resumeAll(false); });
    window.addEventListener('pagehide', onHidden);
    window.addEventListener('pageshow', function () { resumeAll(false); });
    window.addEventListener('focus', function () { resumeAll(false); });
    window.rubezhAudioState = function () {
      return { contexts: ctxs.map(function (c) { return c.state + '@' + c.sampleRate; }),

    };

    var p = document.getElementById('rubezh-safe-probe');
    if (!p && document.body) { p = document.createElement('div'); p.id = 'rubezh-safe-probe'; document.body.appendChild(p); }
    var l = 0, t = 0, r = 0, b = 0;
    if (p) { var cs = getComputedStyle(p); l = parseFloat(cs.paddingLeft) || 0; t = parseFloat(cs.paddingTop) || 0;

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":25224268,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));

		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
