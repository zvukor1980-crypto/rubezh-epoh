  // v1.4.1: ограничение FPS на web — пропуском кадров requestAnimationFrame.
  // Engine.max_fps / low_processor_usage_mode в Godot на web ждут кадр «активным ожиданием» (performance.now в цикле) —
  // процессор крутится на 100% и телефон греется даже в «Экономном». Поэтому на web движок работает без лимита,
  // а частоту задаём здесь: rzSetFps(30) — пропускаем лишние вызовы rAF (ожидание бесплатное, поток спит).
  (function () {
    var R = window.requestAnimationFrame.bind(window), C = window.cancelAnimationFrame.bind(window);
    var fps = 0, last = 0, seq = 0, ids = {}, curT = -1, allow = true;
    window.rzSetFps = function (n) { fps = +n || 0; };
    window.rzGetFps = function () { return fps; };
    window.requestAnimationFrame = function (cb) {
      var my = ++seq;
      var w = function (t) {
        // Решение «рисуем ли этот кадр» принимается один раз на кадр (по метке t) — общее для всех колбэков.
        if (t !== curT) {
          curT = t;
          if (fps > 0 && fps < 58) {
            var iv = 1000 / fps;
            allow = !(t - last < iv - 4);

      return my;

  })();
</script>

	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}

		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
